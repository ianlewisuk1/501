name: Update data

# The league site blocks automated downloads, so new newsletters arrive by hand:
# drop the .xlsx into inbox/ and push, or run this workflow manually.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update
      - name: Commit new data
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update data from newsletter"
          git push
