<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#2c3a33" />
    <script>
      // Light (whiteboard) or dark (chalkboard), before anything paints: the visitor's choice, else dark.
      (function () {
        var t = null;
        try { t = localStorage.getItem("rdl.theme"); } catch (e) {}
        if (t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="Raleigh Dart League: standings, matches, players and records for every division and team." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="RDL" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Raleigh Dart League</title>
    <style>
      /* Opening screen: the RDL logo, centred, when RDL is opened from the home screen (owner, 2026-11-19). */
      #splash { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; background: #000; transition: opacity 0.4s ease; }
      html.splash #splash { display: flex; }
      #splash img { width: min(55vw, 240px); height: auto; aspect-ratio: 1; }
      html[data-theme="light"] #splash { background: #fff; }
      html[data-theme="light"] #splash img { filter: invert(1); }
      #splash.gone { opacity: 0; }
      /* It arrives rather than appearing: fades in, drifting down and growing, with a small turn as it
         settles, like a dart landing (owner, 2026-11-19). backwards: no hold on the end frame, so the
         glide's own transform takes over afterwards. */
      #splash img { animation: splash-in 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(-36px) scale(0.82) rotate(-12deg); } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } #splash img { animation: none; } }
    </style>
    <script>
      // Show it only when launched from the home screen (or with ?splash to preview), once per visit.
      (function () {
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
        var preview = /[?&]splash\b/.test(location.search);
        var seen = false;
        try { seen = sessionStorage.getItem("rdl.splashed") === "1"; sessionStorage.setItem("rdl.splashed", "1"); } catch (e) {}
        if (!preview && (!standalone || seen)) return;
        document.documentElement.classList.add("splash");
        var start = Date.now();
        var done = false;
        function finish(el) { document.documentElement.classList.remove("splash"); el.remove(); }
        function hide() {
          var el = document.getElementById("splash");
          if (done || !el) return;
          done = true;
          // On the lander, the big logo shrinks and glides up into the small one's place while the
          // backdrop fades, so it reads as one logo settling in (owner, 2026-11-19). Elsewhere, or
          // with reduced motion, it simply fades.
          var target = document.querySelector(".board-logo");
          var img = el.querySelector("img");
          var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          var t = target && target.getBoundingClientRect();
          if (!still && t && t.width > 0 && t.bottom > 0 && t.top < innerHeight) {
            var r = img.getBoundingClientRect();
            target.style.visibility = "hidden";
            img.style.transformOrigin = "0 0";
            img.style.transition = "transform 1.4s cubic-bezier(0.4, 0, 0.2, 1)";
            el.style.transition = "background-color 1.4s ease";
            requestAnimationFrame(function () {
              img.style.transform = "translate(" + (t.left - r.left) + "px," + (t.top - r.top) + "px) scale(" + t.width / r.width + ")";
              el.style.backgroundColor = "transparent";
            });
            setTimeout(function () { target.style.visibility = ""; finish(el); }, 1450);
            return;
          }
          el.classList.add("gone");
          setTimeout(function () { finish(el); }, 450);
        }
        // Wait for the lander's logo to be drawn (up to a second), so there's somewhere to land.
        function whenDrawn(cb) {
          var n = 0;
          (function poll() { if (document.querySelector(".board-logo") || location.pathname !== "/" || n++ > 20) cb(); else setTimeout(poll, 50); })();
        }
        // In (1.8s), then held to take in (to 2.8s; owner, 2026-11-19: slower each time), and never stuck past 5.5s.
        window.addEventListener("load", function () { whenDrawn(function () { setTimeout(hide, Math.max(0, 2800 - (Date.now() - start))); }); });
        setTimeout(hide, 5500);
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/rdl-logo-512.png" alt="" width="512" height="512" /></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
